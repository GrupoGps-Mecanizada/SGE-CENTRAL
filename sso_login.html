<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>SGE — Autenticação Centralizada</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        /* ── Fundo claro — idêntico ao SGE_GRUPOGPS Hub ─────────────────── */
        body {
            background: radial-gradient(ellipse at 50% 30%, #f1f5f9 0%, #e8edf5 60%, #dde4ef 100%);
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #bg-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        #vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(180, 192, 210, 0.18) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ── Card — mesmo estilo do center-card do SGE_GRUPOGPS ─────────── */
        .login-box {
            background: #ffffff;
            border: 1px solid rgba(10, 47, 168, 0.12);
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 18px rgba(10, 47, 168, 0.07), 0 1px 4px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 10;
            margin: 0 16px;
            animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Brand block — header do card ───────────────────────────────── */
        .brand-block {
            padding: 28px 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(226, 232, 240, 0.7);
            background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%);
        }

        .brand-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0a2fa8;
            line-height: 1.15;
        }

        .brand-divider {
            width: 32px;
            height: 2px;
            background: #0a2fa8;
            border-radius: 2px;
            opacity: 0.22;
            margin: 10px 0 12px;
        }

        .brand-sub {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* ── Linha do sistema — igual ao hub-sector-header ──────────────── */
        .system-row {
            padding: 13px 20px;
            background: #f8fafc;
            border-bottom: 1px solid rgba(226, 232, 240, 0.7);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .system-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            background: linear-gradient(135deg, #1a56a0 0%, #2563eb 100%);
        }

        .system-icon svg {
            width: 15px;
            height: 15px;
        }

        .system-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .system-name {
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .system-sector {
            font-size: 11px;
            font-weight: 500;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .system-sector::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 2px rgba(34,197,94,0.2);
            flex-shrink: 0;
        }

        /* ── Área do formulário ─────────────────────────────────────────── */
        .form-area {
            padding: 22px 24px 26px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .input-group:last-of-type {
            margin-bottom: 0;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #64748b;
        }

        .input-group input {
            height: 44px;
            background: #f7f9fc;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 14px;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
        }

        .input-group input::placeholder {
            color: #cbd5e1;
            font-size: 13px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0a2fa8;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(10, 47, 168, 0.08);
        }

        .btn-submit {
            width: 100%;
            height: 46px;
            background: #0f3868;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 8px rgba(15, 56, 104, 0.18);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-submit:hover {
            background: #0a2fa8;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(10, 47, 168, 0.22);
        }

        .btn-submit:active {
            transform: translateY(1px);
            box-shadow: 0 1px 4px rgba(15, 56, 104, 0.15);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        #error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: 500;
            text-align: center;
        }

        /* ── Rodapé ─────────────────────────────────────────────────────── */
        .login-footer {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
        }

        .btn-spinner {
            display: inline-block;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 420px) {
            .brand-block { padding: 22px 20px 16px; }
            .form-area   { padding: 18px 18px 22px; }
            .brand-name  { font-size: 24px; }
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>
    <div id="vignette"></div>

    <div class="login-box">

        <!-- Brand block — identidade visual SGE_GRUPOGPS -->
        <div class="brand-block">
            <span class="brand-label">Grupo GPS</span>
            <span class="brand-name">CENTRAL SGE</span>
            <div class="brand-divider"></div>
            <span class="brand-sub">Autenticação Centralizada</span>
        </div>

        <!-- Linha do sistema — dinâmica via app_slug -->
        <div class="system-row">
            <div class="system-icon" id="system-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>
            <div class="system-info">
                <span class="system-name" id="access-system-name">SGE Central</span>
                <span class="system-sector" id="access-sector-name">Setor Corporativo / TI</span>
            </div>
        </div>

        <!-- Formulário -->
        <div class="form-area">
            <form id="sso-form">
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required autocomplete="username" placeholder="seu.email@gps.com.br">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" id="btn-submit" class="btn-submit">Entrar</button>
            </form>
            <div id="error-msg"></div>
        </div>
    </div>

    <div class="login-footer">SGE · Ecossistema Grupo GPS · Mecanizada</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== Particles — idênticas ao SGE_GRUPOGPS =====
        (function () {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    r: Math.random() * 2 + 0.5,
                    dx: (Math.random() - 0.5) * 0.4, dy: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.3 + 0.1
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(10,47,168,${p.opacity})`; ctx.fill();
                    p.x += p.dx; p.y += p.dy;
                    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(10,47,168,${0.06 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.5; ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ===== Ícones por sistema =====
        const SYSTEM_ICONS = {
            default: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>`,
            people:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`,
            doc:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`,
            chart:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>`,
            box:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>`,
        };

        const systemDictionary = {
            'sge_hub':            { name: 'SGE Central',         sector: 'Setor Corporativo / TI', icon: 'default' },
            'gestao_efetivo_mec': { name: 'Gestão de Efetivo',   sector: 'Mecanizada',             icon: 'people'  },
            'relatorio_turno':    { name: 'Relatório de Turno',  sector: 'Mecanizada',             icon: 'doc'     },
            'sge_almoxarifado':   { name: 'Almoxarifado',        sector: 'Mecanizada',             icon: 'box'     },
            'sge_dashboard':      { name: 'Dashboard Executivo', sector: 'Mecanizada',             icon: 'chart'   },
            'controle_medicao':   { name: 'Controle de Medição', sector: 'Mecanizada',             icon: 'doc'     },
        };

        // ===== SSO Logic =====
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams  = new URLSearchParams(window.location.search);
            const appSlug    = urlParams.get('app_slug') || 'sge_hub';
            const redirectUrl = urlParams.get('redirect');

            const sysInfo = systemDictionary[appSlug] || {
                name:   appSlug.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
                sector: 'Mecanizada', icon: 'default'
            };

            document.getElementById('access-system-name').textContent = sysInfo.name;
            document.getElementById('access-sector-name').textContent  = sysInfo.sector;
            document.getElementById('system-icon').innerHTML = SYSTEM_ICONS[sysInfo.icon] || SYSTEM_ICONS.default;

            document.getElementById('sso-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-submit');
                const err = document.getElementById('error-msg');
                btn.disabled = true;
                btn.innerHTML = `<span class="btn-spinner"></span>Autenticando...`;
                err.textContent = '';

                const email = document.getElementById('email').value.trim();
                const pass  = document.getElementById('password').value;

                try {
                    const supaUrl = "https://mgcjidryrjqiceielmzp.supabase.co";
                    const anonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nY2ppZHJ5cmpxaWNlaWVsbXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMjEwNzEsImV4cCI6MjA4NzY5NzA3MX0.UAKkzy5fMIkrlmnqz9E9KknUw9xhoYpa3f1ptRpOuAA";
                    const localSupabase = window.supabase.createClient(supaUrl, anonKey);

                    const { data: authData, error: authError } = await localSupabase.auth.signInWithPassword({ email, password: pass });
                    if (authError) throw new Error("Credenciais inválidas. Verifique e-mail e senha.");

                    const meta = authData.user.user_metadata || {};
                    const jwtPayload = {
                        sub: authData.user.id,
                        user: { id: authData.user.id, email, nome: meta.full_name || email.split('@')[0], perfil: meta.perfil || 'ADM' },
                        app_slug: appSlug,
                        exp: Math.floor(Date.now() / 1000) + (60 * 60 * 8)
                    };

                    let sessionId = null;
                    try {
                        if (appSlug !== 'sge_hub') {
                            const authSupabase = window.supabase.createClient(supaUrl, anonKey, {
                                db: { schema: 'gps_compartilhado' },
                                global: { headers: { 'Authorization': `Bearer ${authData.session.access_token}` } }
                            });
                            const { data: sysData } = await authSupabase.from('sge_central_sistemas').select('id').eq('slug', appSlug).single();
                            if (sysData) {
                                const { data: sessData, error: sessErr } = await authSupabase.from('sge_central_sessoes').insert({
                                    usuario_id: authData.user.id, sistema_id: sysData.id,
                                    ip_address: '0.0.0.0', user_agent: navigator.userAgent.substring(0, 200),
                                    expira_em: new Date(Date.now() + 28800000).toISOString()
                                }).select('id').single();
                                if (!sessErr) sessionId = sessData?.id;
                            }
                        }
                    } catch (e) { console.warn('[SGE SSO] Sessão não registrada:', e); }

                    try {
                        const userName = meta.full_name || meta.nome || email.split('@')[0];
                        localStorage.setItem('sge_session_id', sessionId || '');
                        localStorage.setItem('sge_session_user_id', authData.user.id);
                        localStorage.setItem('sge_session_token', authData.session.access_token);
                        localStorage.setItem('sge_session_user_name', userName);
                        localStorage.setItem('sge_session_user_email', email);
                        localStorage.setItem('sge_session_app_slug', appSlug);
                        localStorage.setItem('sge_session_app_name', sysInfo.name);
                    } catch (e) { /* incognito */ }

                    const payloadBase64 = btoa(JSON.stringify(jwtPayload));
                    const jwtToken = `eyJhbGciOiJIUzI1NiJ9.${payloadBase64}.sge_central_sig`;

                    if (redirectUrl) {
                        window.location.href = `${redirectUrl}${redirectUrl.includes('?') ? '&' : '?'}sso_token=${jwtToken}`;
                    } else {
                        window.location.href = `/?sso_token=${jwtToken}`;
                    }
                } catch (error) {
                    err.textContent = error.message;
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                }
            });
        });
    </script>
</body>

</html>
